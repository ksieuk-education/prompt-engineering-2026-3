[project]
name = "vtoraya-dorozhka"
version = "1.0.0"
description = "Локальный агент для разбора архивных фонограмм"
authors = [
    {name = "Харунжин Максим"},
    {name = "Сухарев Александр"},
    {name = "Лемещенко Мария"},
    {name = "Цапко Нелли"},
]
requires-python = ">=3.11,<3.15"
dependencies = [
    "langgraph>=1.0,<2",
    "mcp>=1.15,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "httpx>=0.28,<1",
    "snowballstemmer>=3,<4",
    "numpy>=1.26,<3",
    "scipy>=1.13,<2",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<10"

[tool.pytest.ini_options]
testpaths = ["tests"]
